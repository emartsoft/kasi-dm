name: Nightly fuzzing

# TPL 7.2: the Content-Disposition and URL filename parser (KASI-ENG-003), 3 minutes a night, and the native messaging host's frame reader,
# strict parser and error replies (KASI-NFR-010, TC-BRW-006), 5 minutes a night, each with SharpFuzz and libFuzzer. libFuzzer
# runs natively on Windows, the platform Kasi ships on. Runs on main only (a schedule always does) and by hand, never on
# pull_request: PRs replay the saved crash corpus as ordinary unit tests instead.
# A finding fails the run, is minimised, and is uploaded as an artifact; add it to tests/fixtures/fuzz/crashes (host:
# tests/fixtures/fuzz/host-crashes) with the fix and file a High defect.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time in seconds for each target (default empty, the TPL budgets - filename 180, host 300)
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # libfuzzer-dotnet (MIT) is a separate binary, pinned here and checked by hash before it runs.
  LIBFUZZER_DOTNET_TAG: v2025.05.02.0904
  LIBFUZZER_DOTNET_SHA256: 17af5b3f6ff4d2c57b44b9a35c13051b570eb66f0557d00015df3832709050bf

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: filename
            seconds: '180'
            findings: artifacts/fuzz/findings/
          - target: host
            seconds: '300'
            findings: artifacts/fuzz-host/findings/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Get libfuzzer-dotnet
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'libfuzzer-dotnet-windows.exe'
          Invoke-WebRequest "https://github.com/Metalnem/libfuzzer-dotnet/releases/download/$env:LIBFUZZER_DOTNET_TAG/libfuzzer-dotnet-windows.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:LIBFUZZER_DOTNET_SHA256.ToUpperInvariant()) { throw "libfuzzer-dotnet hash mismatch: $hash" }
          "LIBFUZZER=$exe" >> $env:GITHUB_ENV

      - name: Fuzz
        shell: pwsh
        run: ./build/Run-Fuzz.ps1 -LibFuzzer $env:LIBFUZZER -Target ${{ matrix.target }} -Seconds ${{ inputs.seconds || matrix.seconds }}

      - name: Upload findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: ${{ matrix.findings }}
          if-no-files-found: warn
