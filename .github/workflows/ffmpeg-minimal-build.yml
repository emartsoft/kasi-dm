name: FFmpeg minimal LGPL build

# Builds the planned minimal LGPL ffmpeg/ffprobe (docs/legal/ffmpeg-lgpl.md) from a pinned upstream source tarball, proves it is
# LGPL, and runs the media integration tests (MediaMuxerTests, MediaJobRunnerTests, FfmpegRunnerTests ...) against it.
# It is run by hand (workflow_dispatch) and must be green before a beta (docs/release-checklist.md). It is not part of every
# pull request: the PR CI uses the pinned stock LGPL build in ci.yml, and this job validates the recipe that will replace it.
# The first run showed that stream copy of ADTS AAC from MPEG-TS needs the native audio decoders ("Could not find codec
# parameters ... unspecified sample rate"), so they are enabled below. If a video codec fails the same way, add its native
# decoder to the configure line and record the change in docs/legal/ffmpeg-lgpl.md.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FFMPEG_VERSION: '8.1.3'
  FFMPEG_SHA256: '7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3'

jobs:
  build-and-test:
    name: Build minimal LGPL FFmpeg and run the media tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # msys2/setup-msys2 v2.33.0 (MIT), pinned by commit; it only installs the MinGW toolchain used to compile FFmpeg.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: make diffutils pkgconf mingw-w64-x86_64-gcc

      - name: Fetch and verify the pinned source
        shell: msys2 {0}
        run: |
          curl -fsSL -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -
          tar xf ffmpeg.tar.xz

      - name: Build
        shell: msys2 {0}
        run: |
          cd "ffmpeg-${FFMPEG_VERSION}"
          ./configure --prefix="$PWD/../ffmpeg-out" --arch=x86_64 --target-os=mingw32 \
            --disable-gpl --disable-nonfree --disable-autodetect --disable-everything \
            --disable-doc --disable-debug --disable-network --disable-ffplay --disable-x86asm \
            --enable-ffmpeg --enable-ffprobe \
            --enable-protocol=file \
            --enable-demuxer=mpegts,mov,matroska,aac,mp3,ac3,eac3 \
            --enable-muxer=mp4,matroska,ipod,mp3 \
            --enable-parser=h264,hevc,av1,aac,aac_latm,ac3,mpegaudio,vp9,opus \
            --enable-decoder=aac,aac_latm,ac3,eac3,mp3float \n            --enable-bsf=aac_adtstoasc,extract_extradata
          make -j"$(nproc)"
          make install

      - name: Prove the build is LGPL and show its configuration
        shell: msys2 {0}
        run: |
          ./ffmpeg-out/bin/ffmpeg.exe -hide_banner -version | tee ffmpeg-version.txt
          ./ffmpeg-out/bin/ffmpeg.exe -hide_banner -L | head -6 | tee ffmpeg-licence.txt
          # the licence text wraps ("GNU Lesser General Public" / "License"), so match the words that stay on one line
          grep -q "GNU Lesser General Public" ffmpeg-licence.txt
          if grep -Eq -- "--enable-(gpl|nonfree|version3)" ffmpeg-version.txt; then echo "GPL or non-free flag found"; exit 1; fi
          ls -l ffmpeg-out/bin/ffmpeg.exe ffmpeg-out/bin/ffprobe.exe

      # Shows FFmpeg's own error when the stream copy of the checked-in TS and fMP4 fixtures fails (the tests only see the exit code).
      - name: Diagnose a direct stream copy
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ff = (Resolve-Path ffmpeg-out/bin/ffmpeg.exe).Path
          $dir = 'tests/fixtures/media/muxable/hls'
          $joined = Join-Path $env:RUNNER_TEMP 'joined.bin'
          $out = [IO.File]::Create($joined)
          foreach ($i in 0..5) { $b = [IO.File]::ReadAllBytes((Join-Path $dir "segment-$i.ts")); $out.Write($b, 0, $b.Length) }
          $out.Close()
          & $ff -hide_banner -loglevel info -protocol_whitelist file -f mpegts -i $joined -map '0:v:0?' -map '0:a:0?' -c copy -movflags +faststart (Join-Path $env:RUNNER_TEMP 'diag.mp4') 2>&1 | Select-Object -Last 40
          & $ff -hide_banner -demuxers | Select-String 'mpegts|mov|matroska'
          & $ff -hide_banner -parsers
          & $ff -hide_banner -decoders

      - name: Media integration tests against this build
        shell: pwsh
        run: |
          $env:KASI_FFMPEG = (Resolve-Path ffmpeg-out/bin/ffmpeg.exe).Path
          $env:KASI_FFPROBE = (Resolve-Path ffmpeg-out/bin/ffprobe.exe).Path
          dotnet test tests/Kasi.Media.Tests -c Release

      - name: Package the binaries, source and configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ffmpeg-release | Out-Null
          Copy-Item ffmpeg-out/bin/ffmpeg.exe, ffmpeg-out/bin/ffprobe.exe, ffmpeg.tar.xz, ffmpeg-version.txt, ffmpeg-licence.txt ffmpeg-release
          Copy-Item .github/workflows/ffmpeg-minimal-build.yml ffmpeg-release/build-recipe.yml
          Compress-Archive -Path ffmpeg-release/* -DestinationPath ffmpeg-minimal-lgpl.zip
          (Get-FileHash ffmpeg-minimal-lgpl.zip -Algorithm SHA256).Hash | Tee-Object ffmpeg-minimal-lgpl.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-lgpl
          path: |
            ffmpeg-minimal-lgpl.zip
            ffmpeg-minimal-lgpl.zip.sha256
