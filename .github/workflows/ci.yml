name: CI

# TRD 14.5 step 1: build, unit tests, integration tests against local test servers, coverage.
# The extension job (lint, format, type drift, Vitest, dual build) is a separate Windows job; no browsers are installed in it.
# The native-host job publishes Kasi.NativeHost with Native AOT, checks its size and runs the AOT executable sample test (M2.2b).
# The engine coverage gate (80% of Kasi.Engine lines, KASI-NFR-018) is on since M1.16a: build/Test-CoverageGate.ps1 reads the merged Cobertura report.

on:
  pull_request: # any base branch, so stacked PRs are checked too
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test, coverage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kasi.slnx

      - name: Format check
        run: dotnet format Kasi.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Kasi.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test Kasi.slnx -c Release --no-build
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage" --results-directory TestResults/unit --logger trx

      - name: Integration tests
        env:
          KASI_REQUIRE_VHD: '1'
        # -m:1 runs one test assembly at a time: the integration tests assert on timing (throttles, restart windows, kill loops),
        # and several assemblies at once on a 4-core runner made them flaky
        run: >
          dotnet test Kasi.slnx -c Release --no-build -m:1
          --filter "Category=Integration&Category!=ContainerIntegration"
          --collect:"XPlat Code Coverage" --results-directory TestResults/integration --logger trx

      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator `
            "-reports:TestResults/**/coverage.cobertura.xml" `
            "-targetdir:coverage" `
            "-reporttypes:HtmlInline_AzurePipelines;MarkdownSummaryGithub;Cobertura" `
            "-assemblyfilters:+Kasi.*;-Kasi.TestServer;-*.Tests;-Kasi.ArchitectureTests"
          if (Test-Path coverage/SummaryGithub.md) { Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY }

      - name: Engine coverage gate (KASI-NFR-018)
        # no hashFiles guard: a missing report must fail the gate (exit 2), not skip it
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./build/Test-CoverageGate.ps1 -Cobertura coverage/Cobertura.xml -Assembly Kasi.Engine -Threshold 0.80

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: warn

  # TPL 3.4: ARM64 build verification and smoke tests on the hosted Windows 11 ARM64 runner (free for public repos).
  # Linux-container integration tests and coverage stay on the x64 job above.
  build-test-arm64:
    name: Build and unit tests (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kasi.slnx

      - name: Build
        run: dotnet build Kasi.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Kasi.slnx -c Release --no-build --filter "Category!=Integration"

      # The SQLite persistence tests are tagged Integration (TRD 12), so the filter above skips them; run them here too so
      # the ARM64 build exercises the native SQLite and the checkpoint writer.
      - name: Persistence tests (SQLite)
        run: dotnet test tests/Kasi.Data.Tests -c Release --no-build

  # M2.3 (plan docs/plans/m2-3.md section 3): the TypeScript extension. Browser smoke runs nightly in nightly-extension-smoke.yml.
  extension:
    name: Extension (lint, tests, build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run check:types
      - run: npm test
      - run: npm run build
      # M2.7: the store zips and the AMO source package, checked for a key, source maps and the manifest version
      - run: npm run package -- --skip-build

  # M2.2b (plan docs/plans/m2-2.md section 3): the Native AOT publish of the browser's native messaging host, with zero warnings
  # (TreatWarningsAsErrors covers trimming and AOT warnings), a size limit, a recorded cold start and the malformed-message sample
  # (TC-BRW-006) run against the published executable over real pipes.
  native-host-aot:
    name: Native host (AOT publish, size, start-up)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (Native AOT, win-x64)
        run: dotnet publish src/Kasi.NativeHost/Kasi.NativeHost.csproj -c Release -r win-x64 -o artifacts/native-host --nologo

      - name: Size limit and cold start
        shell: pwsh
        # the size (5 MB) gates; the start-up median of 20 launches is recorded in the job summary and never gates
        run: ./build/Measure-NativeHost.ps1 -Exe artifacts/native-host/Kasi.NativeHost.exe -MaxMegabytes 5 -Launches 20

      - name: AOT executable sample (TC-BRW-006)
        shell: pwsh
        env:
          KASI_REQUIRE_AOT: '1'
        run: |
          $env:KASI_NATIVEHOST_AOT = (Resolve-Path artifacts/native-host/Kasi.NativeHost.exe).Path
          dotnet test tests/Kasi.NativeHost.Tests -c Release --nologo --filter "Category=AotSample"

      - name: Upload the host
        uses: actions/upload-artifact@v4
        with:
          name: native-host-win-x64
          path: artifacts/native-host/Kasi.NativeHost.exe
          if-no-files-found: error
