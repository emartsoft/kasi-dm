name: CI

# TRD 14.5 step 1: build, unit tests, integration tests against local test servers, coverage.
# The extension job (lint, format, type drift, Vitest, dual build) is a separate Windows job; no browsers are installed in it.
# The engine coverage gate (80% of Kasi.Engine lines, KASI-NFR-018) is on since M1.16a: build/Test-CoverageGate.ps1 reads the merged Cobertura report.

on:
  pull_request: # any base branch, so stacked PRs are checked too
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test, coverage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kasi.slnx

      - name: Format check
        run: dotnet format Kasi.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Kasi.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test Kasi.slnx -c Release --no-build
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage" --results-directory TestResults/unit --logger trx

      - name: Integration tests
        env:
          KASI_REQUIRE_VHD: '1'
        run: >
          dotnet test Kasi.slnx -c Release --no-build
          --filter "Category=Integration&Category!=ContainerIntegration"
          --collect:"XPlat Code Coverage" --results-directory TestResults/integration --logger trx

      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator `
            "-reports:TestResults/**/coverage.cobertura.xml" `
            "-targetdir:coverage" `
            "-reporttypes:HtmlInline_AzurePipelines;MarkdownSummaryGithub;Cobertura" `
            "-assemblyfilters:+Kasi.*;-Kasi.TestServer;-*.Tests;-Kasi.ArchitectureTests"
          if (Test-Path coverage/SummaryGithub.md) { Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY }

      - name: Engine coverage gate (KASI-NFR-018)
        # no hashFiles guard: a missing report must fail the gate (exit 2), not skip it
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./build/Test-CoverageGate.ps1 -Cobertura coverage/Cobertura.xml -Assembly Kasi.Engine -Threshold 0.80

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: warn

  # TPL 3.4: ARM64 build verification and smoke tests on the hosted Windows 11 ARM64 runner (free for public repos).
  # Linux-container integration tests and coverage stay on the x64 job above.
  build-test-arm64:
    name: Build and unit tests (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kasi.slnx

      - name: Build
        run: dotnet build Kasi.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Kasi.slnx -c Release --no-build --filter "Category!=Integration"

      # The SQLite persistence tests are tagged Integration (TRD 12), so the filter above skips them; run them here too so
      # the ARM64 build exercises the native SQLite and the checkpoint writer.
      - name: Persistence tests (SQLite)
        run: dotnet test tests/Kasi.Data.Tests -c Release --no-build

  # M2.3 (plan docs/plans/m2-3.md section 3): the TypeScript extension. Browser smoke runs nightly in nightly-extension-smoke.yml.
  extension:
    name: Extension (lint, tests, build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run check:types
      - run: npm test
      - run: npm run build
