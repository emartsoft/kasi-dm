<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1745B8"/>
      <stop offset="0.55" stop-color="#0B1F63"/>
      <stop offset="1" stop-color="#060F33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.82" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEBFF"/>
      <stop offset="1" stop-color="#1E5BFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9F3FF"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FE6FF"/>
      <stop offset="1" stop-color="#1F6BFF"/>
    </linearGradient>
    <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5BFF"/>
      <stop offset="1" stop-color="#2FC8FF"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#3FE6FF"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#glow)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- speed streaks -->
  <path d="M28 70H82L78 82H28Z" fill="url(#streak)" opacity="0.75"/>
  <path d="M28 94H88L84 106H28Z" fill="url(#streak)"/>
  <path d="M28 118H82L78 130H28Z" fill="url(#streak)" opacity="0.6"/>
  <!-- K arms -->
  <path d="M126 118L186 56H212L146 126Z" fill="url(#arm)" stroke="url(#arm)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M140 108L200 168H174L126 124Z" fill="url(#arm2)" stroke="url(#arm2)" stroke-width="6" stroke-linejoin="round"/>
  <!-- arrow = K stem -->
  <path d="M95 50Q95 41 104 41H120Q129 41 129 50V133H150L112 175L74 133H95Z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="6" stroke-linejoin="round"/>
  <!-- tray -->
  <path d="M46 176V204Q46 222 64 222H192Q210 222 210 204V176" fill="none" stroke="#2FD8F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- segmented progress -->
  <rect x="62" y="196" width="30" height="12" rx="4" fill="#3BF0B0"/>
  <rect x="98" y="196" width="30" height="12" rx="4" fill="#2EE3C9"/>
  <rect x="134" y="196" width="30" height="12" rx="4" fill="#28CFF2"/>
  <rect x="170" y="196" width="24" height="12" rx="4" fill="#2A8CFF" opacity="0.45"/>
</svg>
